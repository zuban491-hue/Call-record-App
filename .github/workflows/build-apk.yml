
name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'Call_Capture_Legal_Privacy_Data_Controls_SDK37/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: Call_Capture_Legal_Privacy_Data_Controls_SDK37
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Call-Recorder-Debug-APK
          path: Call_Capture_Legal_Privacy_Data_Controls_SDK37/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
